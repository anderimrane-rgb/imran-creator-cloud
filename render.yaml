services:
  - type: web
    name: imran-creator-cloud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 server:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: imran_admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: UPDATE_SIGNING_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
